name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose assets should be rebuilt
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    env:
      RELEASE_REF: ${{ needs.release-please.outputs.sha || inputs.tag }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          version=${RELEASE_TAG#v}
          base="terrablade_${version}_${GOOS}_${GOARCH}"
          binary=terrablade
          archive_extension=tar.gz

          if [[ "$GOOS" == windows ]]; then
            binary=terrablade.exe
            archive_extension=zip
          fi

          mkdir -p release-assets "$RUNNER_TEMP/$base"
          go build -trimpath -ldflags='-s -w' \
            -o "$RUNNER_TEMP/$base/$binary" ./cmd/terrablade
          cp LICENSE LICENSE-UNICODE "$RUNNER_TEMP/$base/"

          if [[ "$archive_extension" == zip ]]; then
            (cd "$RUNNER_TEMP" && \
              zip -qr "$GITHUB_WORKSPACE/release-assets/$base.zip" "$base")
          else
            tar -czf "release-assets/$base.tar.gz" -C "$RUNNER_TEMP" "$base"
          fi
      - name: Save archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish assets
    needs: [release-please, build]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.release-please.outputs.created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum -- * > checksums.txt
      - name: Upload release assets
        if: github.event_name == 'push'
        run: gh release upload "$RELEASE_TAG" release-assets/*
      - name: Replace release assets
        if: github.event_name == 'workflow_dispatch'
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
